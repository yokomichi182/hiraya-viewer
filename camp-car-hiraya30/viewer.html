<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平屋の3Dウォークスルー</title>
<style>
  html, body { margin: 0; height: 100%; background: #dcefff; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; left: 12px; right: 12px; bottom: 12px; display: none; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #ui button { font: inherit; font-size: 15px; padding: 10px 14px; border-radius: 10px; border: 1px solid #0003; background: #fffe; }
  #notice { position: fixed; left: 12px; top: 10px; font-size: 13px; color: #fff; text-shadow: 0 1px 3px #000a; display: none; }
  body.interactive #ui, body.interactive #notice { display: flex; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="notice">※建築イメージです（実際の設計・価格は工務店によります）</div>
<div id="ui">
  <button data-act="outside">外観</button>
  <button data-act="roof">屋根を外す</button>
  <button data-act="night">夜にする</button>
</div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
